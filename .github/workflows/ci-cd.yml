name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ./app
        run: python -m pytest -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
           sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app:latest
           sudo docker stop devops-demo-app || true
           sudo docker rm devops-demo-app || true
           sudo docker run -d --name devops-demo-app -p 5000:5000 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app:latest